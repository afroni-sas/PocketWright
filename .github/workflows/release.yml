name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

env:
  ABI: arm64-v8a
  # The SHA-256 digest of the release signing certificate. A build signed by anything else is not published.
  SIGNING_CERT_SHA256: 2d8ac18c51c6222671f33023bb9ba34f246c98f1078dc662499335220cbc58ba

jobs:
  release:
    name: Build and publish the signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag against the app version and the changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! grep -qF "versionName = \"$version\"" app/build.gradle.kts; then
            echo "::error::Tag $GITHUB_REF_NAME does not match versionName in app/build.gradle.kts"
            exit 1
          fi
          if ! grep -qF "## [$version]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "APK=PocketWright-$version-$ABI.apk" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-37.0 ndk;30.0.16248370 cmake;4.1.2

      # A release reuses nothing from a cache.
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      - name: Restore the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.POCKETWRIGHT_KEYSTORE_BASE64 }}
        run: |
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.p12"

      - name: Build the signed APK
        env:
          POCKETWRIGHT_KEYSTORE: ${{ runner.temp }}/release.p12
          POCKETWRIGHT_KEYSTORE_PASSWORD: ${{ secrets.POCKETWRIGHT_KEYSTORE_PASSWORD }}
        run: ./gradlew :app:assembleRelease -Ppocketwright.abis="$ABI" --no-daemon --no-configuration-cache --no-build-cache

      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.p12"

      - name: Verify the signature
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          "$apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk | tee signature.txt
          grep -qF "certificate SHA-256 digest: $SIGNING_CERT_SHA256" signature.txt

      - name: Prepare the release files
        run: |
          mkdir dist
          cp app/build/outputs/apk/release/app-release.apk "dist/$APK"
          (cd dist && sha256sum "$APK" > "$APK.sha256")
          # Node.js's license is not inside the APK, so it is published next to it.
          node_version="$(sed -n 's/^NODE_MOBILE_VERSION="\(.*\)"/\1/p' scripts/prepare-engine.sh)"
          {
            cat NOTICE
            printf '\n\n===== Apache License 2.0 =====\n\n'
            cat LICENSE
            printf '\n\n===== Node.js for mobile =====\n\n'
            curl -fsSL "https://raw.githubusercontent.com/digidem/nodejs-mobile/v$node_version/LICENSE"
          } > dist/THIRD_PARTY_NOTICES.txt

      - name: Write the release notes
        run: |
          awk -v header="## [$VERSION]" 'index($0, header) == 1 { found = 1; next } /^## \[/ || /^\[[^]]+\]: / { found = 0 } found' CHANGELOG.md > changes.md
          {
            cat changes.md
            envsubst '$APK $SIGNING_CERT_SHA256 $GITHUB_SHA $GITHUB_SERVER_URL $GITHUB_REPOSITORY $GITHUB_RUN_ID' < .github/release-notes.md
          } > notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "PocketWright $VERSION" --notes-file notes.md "${flags[@]}"
