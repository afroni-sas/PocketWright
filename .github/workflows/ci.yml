name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Unit tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-37 ndk;30.0.16248370 cmake;4.1.2

      - uses: gradle/actions/setup-gradle@v4

      - name: Cache Node.js for Android
        uses: actions/cache@v4
        with:
          path: third_party
          key: nodejs-mobile-${{ hashFiles('scripts/prepare-engine.sh') }}

      - name: Run unit tests and build the debug APK
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug -Ppocketwright.abis=arm64-v8a

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests
          retention-days: 7

      - name: Upload the debug APK
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: pocketwright-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  scripts:
    name: Script syntax
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Check JavaScript syntax
        run: |
          node --check engine/main.js
          find tests/e2e -type f \( -name '*.mjs' -o -name '*.js' \) -print0 | xargs -0 -n1 node --check

      - name: Check shell syntax
        run: |
          bash -n scripts/prepare-engine.sh
          bash -n tests/e2e/device-ui.sh
