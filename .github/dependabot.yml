version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    groups:
      androidx-and-compose:
        patterns:
          - androidx.*
      kotlin-and-ktor:
        patterns:
          - org.jetbrains.*
          - io.ktor*

  - package-ecosystem: npm
    directory: /engine
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /tests/e2e
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
